<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamento de Lucas e Evelyn</title>
    <link rel="shortcut icon" href="assets/img/alianca.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/mobile.css" media="screen and (max-width: 700px)">
    <link rel="stylesheet" href="assets/css/pc.css" media="screen and (min-width: 701px)">
</head>

<body>
    <main>
        <div class="flores-header">
            <img src="assets/img/flores-header.png" alt="flores-header">
        </div>
        <p class="casamento-logo">
            CASAMENTO
        </p>
        <div class="name-box">
            <p>Lucas<span>&</span></p>
            <p>Evelyn</p>
        </div>

        <div class="button-div">
            <button id="music-button" type="button" aria-label="Tocar música" aria-pressed="false">
                <img src="assets/img/play.svg" alt="" aria-hidden="true" width="48" height="48">
            </button>
        </div>

        <div class="music-text">
            <p>aperte o play</p>
        </div>
        <div class="versiculo">
            <p>"Para que todos vejam, e saibam, e considerem, e juntamente entendam que a mão do senhor fez isto..."</p>
            <p>Isaías 41:20</p>
        </div>
        <div class="bencao">
            <p>COM A BENÇÃO DE DEUS E DE NOSSOS PAIS</p>
        </div>
        <div class="pais-name">
            <div class="pais-name-primeiro">
                <p>MÃE AUGUSTO</p>
                <p>PAI AUGUSTO</p>
            </div>

            <div>
                <p>MÃE EVELYN</p>
                <p>PAI EVELYN</p> 
            </div>
        </div>
        <audio id="wedding-music" preload="none">
            <source src="assets/music/Aliança - Tribalistas (lyric video) - MARISAMONTE.mp3" type="audio/mpeg">
            Seu navegador não oferece suporte à reprodução de áudio.
        </audio>
    </main>
    <section class="bloco-2">

    </section>

    <script src="assets/js/index.js" defer></script>
</body>

</html>
